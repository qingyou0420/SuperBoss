name: connector-release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: py -m pip install uv==0.12.3
      - name: Build packaged connector
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File integrations/kimi-superboss/scripts/build-windows.ps1
      - name: Write SHA-256 sidecar
        shell: pwsh
        run: |
          $exe = "integrations/kimi-superboss/connector/dist/superboss.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Packaged connector was not produced."
          }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$exe.sha256" -Value "$hash  superboss.exe" -NoNewline -Encoding ascii
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "integrations/kimi-superboss/connector/dist/superboss.exe" `
            "integrations/kimi-superboss/connector/dist/superboss.exe.sha256" `
            --generate-notes
