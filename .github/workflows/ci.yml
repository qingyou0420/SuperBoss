name: ci
on:
  pull_request:
  push:
    branches: [master, 'feature/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superboss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d superboss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPERBOSS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/superboss_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Ruff
        working-directory: server
        run: uv run --locked --group dev ruff check src tests
      - name: Pytest
        working-directory: server
        run: uv run --locked --group dev pytest -q tests/unit tests/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Test
        working-directory: web
        run: npm run test -- --run

  e2e-visual:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://127.0.0.1
      E2E_ALLOW_LOCAL_SELF_SIGNED: "true"
      E2E_TARGET: local
      E2E_OWNER_USERNAME: ownere2e
      E2E_OWNER_PASSWORD: visual-gate-12
      E2E_STAFF_USERNAME: staffe2e
      E2E_STAFF_PASSWORD: visual-gate-12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install
        working-directory: tests/e2e
        run: npm ci
      - name: Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Visual snapshots (fixme until recapture)
        working-directory: tests/e2e
        run: npx playwright test specs/visual-pages.spec.ts
