name: ci
on:
  pull_request:
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Recapture visual baselines in the CI container
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superboss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d superboss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPERBOSS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/superboss_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Ruff
        working-directory: server
        run: |
          uv run --locked --group dev ruff check src tests
          uv run --locked --group dev ruff format --check src tests
      - name: Pytest
        working-directory: server
        run: uv run --locked --group dev pytest -q tests/unit tests/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Test
        working-directory: web
        run: npm run test -- --run

  e2e-visual:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://app.localhost
      E2E_ALLOW_LOCAL_SELF_SIGNED: "true"
      E2E_TARGET: local
      E2E_OWNER_USERNAME: ownere2e
      E2E_OWNER_PASSWORD: visual-gate-12
      E2E_STAFF_USERNAME: staffe2e
      E2E_STAFF_PASSWORD: visual-gate-12
      SUPERBOSS_OWNER_USERNAME: ownere2e
      SUPERBOSS_OWNER_PASSWORD: visual-gate-12
      SUPERBOSS_ACCEPTANCE_STAFF_USERNAME: staffe2e
      SUPERBOSS_ACCEPTANCE_STAFF_PASSWORD: visual-gate-12
      SUPERBOSS_DATABASE_URL: postgresql+asyncpg://superboss:superboss@127.0.0.1:5432/superboss
      SUPERBOSS_ENVIRONMENT: development
      SUPERBOSS_JWT_SECRET: ci-visual-jwt-secret-change-before-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: TLS for docker compose
        run: |
          echo "127.0.0.1 app.localhost objects.localhost" | sudo tee -a /etc/hosts
          mkdir -p ops/local-tls
          openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes \
            -keyout ops/local-tls/tls.key \
            -out ops/local-tls/tls.crt \
            -subj "/CN=app.localhost" \
            -addext "subjectAltName=DNS:app.localhost,DNS:objects.localhost,IP:127.0.0.1"
          printf 'allow 127.0.0.1;\nallow ::1;\nallow 172.16.0.0/12;\ndeny all;\n' > ops/local-tls/allowlist.conf
      - name: Dev stack
        run: docker compose -f docker-compose.dev.yml up -d --build --wait postgres redis minio minio-init api web nginx
      - name: Acceptance seed
        working-directory: server
        run: uv run --locked python scripts/seed_acceptance.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install
        working-directory: tests/e2e
        run: npm ci
      - name: Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Login reachable
        run: curl -fsS -k -o /dev/null https://app.localhost/login
      - name: Visual snapshots
        working-directory: tests/e2e
        run: |
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ]; then
            npx playwright test specs/visual-pages.spec.ts --update-snapshots
          else
            npx playwright test specs/visual-pages.spec.ts
          fi
      - name: Upload recaptured snapshots
        if: ${{ always() && github.event.inputs.update_snapshots == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-pages-snapshots
          path: tests/e2e/specs/visual-pages.spec.ts-snapshots/
      - name: Upload playwright output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-visual-output
          path: tests/e2e/output/
