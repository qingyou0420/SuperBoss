name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superboss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d superboss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPERBOSS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/superboss_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Ruff
        working-directory: server
        run: uv run --locked --group dev ruff check src tests
      - name: Pytest
        working-directory: server
        run: uv run --locked --group dev pytest -q tests/unit tests/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Test
        working-directory: web
        run: npm run test -- --run

  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Pytest
        working-directory: integrations/kimi-superboss/connector
        run: uv run --locked --group dev pytest -q
