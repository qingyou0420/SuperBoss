x-backend-build: &backend-build
  context: ./server

x-backend-environment: &backend-environment
  SUPERBOSS_ENVIRONMENT: development
  SUPERBOSS_DATABASE_URL: postgresql+asyncpg://superboss:superboss@postgres:5432/superboss
  SUPERBOSS_JWT_SECRET: ${SUPERBOSS_JWT_SECRET:-development-only-jwt-secret-change-before-deploy}
  SUPERBOSS_S3_BUCKET: superboss-files
  SUPERBOSS_S3_ENDPOINT_URL: http://minio:9000
  SUPERBOSS_S3_ACCESS_KEY_ID: superboss
  SUPERBOSS_S3_SECRET_ACCESS_KEY: superboss-dev-only
  SUPERBOSS_REDIS_URL: redis://redis:6379/0
  SUPERBOSS_CLAMAV_HOST: clamav
  SUPERBOSS_CLAMAV_PORT: "3310"
  SUPERBOSS_CLAMAV_MAX_STREAM_BYTES: "104857600"

services:
  api:
    build: *backend-build
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn superboss.main:app --host 0.0.0.0 --port 8000
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend
      - edge
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: superboss
      POSTGRES_USER: superboss
      POSTGRES_PASSWORD: superboss
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superboss -d superboss"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: superboss
      MINIO_ROOT_PASSWORD: superboss-dev-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
      - edge
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: superboss
      MINIO_ROOT_PASSWORD: superboss-dev-only
      MINIO_BUCKET: superboss-files
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  clamav:
    image: clamav/clamav:1.5.3
    profiles: ["scan"]
    volumes:
      - clamav-database:/var/lib/clamav
      - ./server/config/clamd.conf:/etc/clamav/clamd.conf:ro
    networks:
      - backend
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_OBJECT_STORAGE_ORIGIN: https://objects.localhost
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - edge
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    environment:
      SUPERBOSS_APP_HOST: app.localhost
      SUPERBOSS_OBJECTS_HOST: objects.localhost
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/conf.d/superboss.conf:/etc/nginx/templates/superboss.conf.template:ro
      - ./ops/local-tls/allowlist.conf:/etc/nginx/allowlist.conf:ro
      - ./ops/local-tls/tls.crt:/etc/nginx/tls/tls.crt:ro
      - ./ops/local-tls/tls.key:/etc/nginx/tls/tls.key:ro
    ports:
      - "127.0.0.1:443:443"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null --no-check-certificate https://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      edge: {}
      backend:
        aliases:
          - objects.localhost
    restart: unless-stopped

  worker:
    build: *backend-build
    command:
      - celery
      - -A
      - superboss.workers.celery_app:celery_app
      - worker
      - --beat
      - --loglevel=INFO
      - --queues=file-scan
      - --concurrency=1
      - --prefetch-multiplier=1
      - --schedule=/var/lib/celery/celerybeat-schedule
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
        required: false
    volumes:
      - celery-beat-data:/var/lib/celery
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-database:
  celery-beat-data:

networks:
  backend: {}
  edge: {}
