[project]
name = "superboss"
version = "0.1.0"
description = "SuperBoss backend service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic",
    "argon2-cffi",
    "asyncpg",
    "boto3",
    "celery[redis]",
    "fastapi",
    "httpx",
    "pyjwt",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.67",
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "ruff",
    "testcontainers[postgres]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superboss"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
