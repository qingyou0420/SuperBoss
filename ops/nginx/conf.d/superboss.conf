upstream superboss_api {
    server api:8000;
    keepalive 16;
}

upstream superboss_web {
    server web:8080;
    keepalive 16;
}

upstream superboss_minio {
    server minio:9000;
    keepalive 16;
}

map $request_method $superboss_objects_target {
    default @objects_proxy;
    OPTIONS @objects_preflight;
}

server {
    listen 443 ssl;
    server_name ${SUPERBOSS_APP_HOST};

    include /etc/nginx/allowlist.conf;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://${SUPERBOSS_OBJECTS_HOST}; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    client_max_body_size 2m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://superboss_api;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://superboss_web;
    }
}

server {
    listen 443 ssl;
    server_name ${SUPERBOSS_OBJECTS_HOST};

    include /etc/nginx/allowlist.conf;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header Access-Control-Allow-Origin https://${SUPERBOSS_APP_HOST} always;
    add_header Access-Control-Allow-Methods GET,HEAD,PUT,OPTIONS always;
    add_header Access-Control-Allow-Headers Content-Type always;
    add_header Access-Control-Expose-Headers ETag always;
    add_header Vary Origin always;

    client_max_body_size 100m;
    client_body_timeout 600s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        include /etc/nginx/allowlist.conf;
        try_files __superboss_route_never_exists__ $superboss_objects_target;
    }

    location @objects_preflight {
        include /etc/nginx/allowlist.conf;
        return 204;
    }

    location @objects_proxy {
        include /etc/nginx/allowlist.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_pass http://superboss_minio;
        proxy_redirect off;
    }
}
