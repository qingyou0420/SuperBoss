[project]
name = "superboss-kimi-connector"
version = "0.1.0"
description = "Windows-safe transport for Kimi result packages"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "platformdirs>=4,<5",
    "portalocker>=3,<4",
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
]

[project.scripts]
superboss = "superboss_connector.cli:main"

[dependency-groups]
dev = [
    "build>=1,<2",
    "mypy>=1.17,<2",
    "pyinstaller>=6,<7",
    "pytest>=8,<10",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superboss_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
